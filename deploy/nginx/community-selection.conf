# Replace example.com and certificate paths before production use.
server {
  listen 80;
  server_name api.example.com admin.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name api.example.com;

  ssl_certificate /etc/nginx/certs/api.example.com/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/api.example.com/privkey.pem;

  client_max_body_size 10m;

  location / {
    proxy_pass http://127.0.0.1:13080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

server {
  listen 443 ssl http2;
  server_name admin.example.com;

  ssl_certificate /etc/nginx/certs/admin.example.com/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/admin.example.com/privkey.pem;

  root /var/www/community-selection-admin;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
