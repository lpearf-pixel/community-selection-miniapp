name: L52 Production Readiness

on:
  pull_request:
    branches:
      - stable/l50-a3-4-business-base
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l52-production-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production-gate:
    runs-on: [self-hosted, community]
    timeout-minutes: 150
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      VITEST_MAX_THREADS: "2"
      VITEST_MIN_THREADS: "1"
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @community-selection/config build

      - name: Create synthetic production fixture
        shell: bash
        run: |
          umask 077
          mkdir -p secrets
          openssl req -x509 -newkey rsa:2048 -nodes \
            -subj /CN=l52.ci.invalid \
            -keyout secrets/wechat_private_key.pem \
            -out secrets/wechat_platform_certificate.pem \
            -days 1 \
            -set_serial 0xA1B2C3D4
          printf '%s\n' 'ci-backup-passphrase-abcdefghijklmnopqrstuvwxyz' \
            > secrets/backup_passphrase
          printf 'IMAGE_TAG=%s\n' "${IMAGE_TAG}" > .env.production.ci
          cat >> .env.production.ci <<'ENV'
          NODE_ENV=production
          PORT=13080
          API_DOMAIN=api.ci.invalid
          ADMIN_DOMAIN=admin.ci.invalid
          ACME_EMAIL=ops@ci.invalid
          POSTGRES_DB=community_selection
          POSTGRES_USER=community_selection
          POSTGRES_PASSWORD=ci_database_password_abcdefghijklmnopqrstuvwxyz
          DATABASE_URL=postgresql://community_selection:ci_database_password_abcdefghijklmnopqrstuvwxyz@postgres:5432/community_selection?schema=public
          ADMIN_AUTH_ENABLED=true
          ADMIN_AUTH_MODE=session
          ADMIN_TOKEN=ci-admin-token-abcdefghijklmnopqrstuvwxyz
          ADMIN_TOTP_ENCRYPTION_KEY=ci-totp-key-abcdefghijklmnopqrstuvwxyz
          WECHAT_PAY_MODE=wechat
          MOCK_WECHAT_PAY=false
          CURRENT_USER_MOCK_HEADERS_ENABLED=false
          WECHAT_APP_ID=wx-ci-only
          WECHAT_APP_SECRET=ci-wechat-app-secret-abcdefghijklmnopqrstuvwxyz
          WECHAT_MCH_ID=1900000001
          WECHAT_MCH_SERIAL_NO=CI-MERCHANT-SERIAL
          WECHAT_API_V3_KEY=12345678901234567890123456789012
          WECHAT_PRIVATE_KEY_PATH=/run/secrets/wechat_private_key.pem
          WECHAT_PAY_PLATFORM_SERIAL_NO=A1B2C3D4
          WECHAT_PAY_PLATFORM_CERT_PATH=/run/secrets/wechat_platform_certificate.pem
          WECHAT_PAY_NOTIFY_URL=https://api.ci.invalid/api/payments/wechat/notify
          WECHAT_REFUND_NOTIFY_URL=https://api.ci.invalid/api/refunds/wechat/notify
          MINIAPP_API_BASE_URL=https://api.ci.invalid
          USER_SESSION_TOKEN_SECRET=ci-user-session-secret-abcdefghijklmnopqrstuvwxyz
          FIRST_LAUNCH_MODE=true
          MEMBERSHIP_ENABLED=false
          COUPONS_ENABLED=false
          CASH_REWARDS_ENABLED=false
          WITHDRAWALS_ENABLED=false
          AUTO_PAYOUT_ENABLED=false
          AUTO_TAX_FILING_ENABLED=false
          WECHAT_TRANSFER_ENABLED=false
          WECHAT_MERCHANT_TRANSFER_ENABLED=false
          BACKUP_RETENTION_DAYS=14
          BACKUP_ENCRYPTION_PASSPHRASE_FILE=/run/secrets/backup_passphrase
          ENV
          chmod 600 secrets/* .env.production.ci
          secret_volume="community-selection-l52-${GITHUB_RUN_ID}-secrets"
          helper="community-selection-l52-${GITHUB_RUN_ID}-secret-seed"
          docker volume create "${secret_volume}"
          docker create \
            --name "${helper}" \
            --entrypoint sh \
            -v "${secret_volume}:/run/secrets" \
            caddy:2.9.1-alpine \
            -c 'chown 1000:1000 /run/secrets/wechat_private_key.pem /run/secrets/wechat_platform_certificate.pem && chmod 600 /run/secrets/*'
          docker cp secrets/. "${helper}:/run/secrets/"
          docker start --attach "${helper}"
          docker rm "${helper}"

      - name: Verify production contracts
        run: |
          node --test scripts/production/*.test.cjs
          bash -n \
            scripts/pg-backup.sh \
            scripts/pg-restore.sh \
            scripts/production/*.sh
          node scripts/production/preflight.mjs \
            --env-file .env.production.ci \
            --api-runtime-uid "$(id -u)"

      - name: Render container-runner production topology
        shell: bash
        run: |
          docker compose version
          docker compose \
            --project-name community-selection-l52-${GITHUB_RUN_ID} \
            --env-file .env.production.ci \
            --profile '*' \
            -f docker-compose.production.yml \
            config --format json > .github/l52-compose.production.json
          node scripts/production/render-l52-compose.mjs \
            --input .github/l52-compose.production.json \
            --output .github/l52-compose.rendered.json \
            --secret-volume community-selection-l52-${GITHUB_RUN_ID}-secrets
          docker compose --project-name community-selection-l52-${GITHUB_RUN_ID} -f .github/l52-compose.rendered.json config --quiet

      - name: Build immutable production images
        run: |
          docker compose \
            --project-name community-selection-l52-${GITHUB_RUN_ID} \
            -f .github/l52-compose.rendered.json \
            build api edge backup
          docker run --rm --network none \
            community-selection-api:${IMAGE_TAG} \
            ./node_modules/.bin/prisma -v
          docker compose \
            --project-name community-selection-l52-${GITHUB_RUN_ID} \
            -f .github/l52-compose.rendered.json \
            run --rm --no-deps edge \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Verify one-shot production migration
        shell: bash
        run: |
          compose=(docker compose \
            --project-name community-selection-l52-${GITHUB_RUN_ID} \
            -f .github/l52-compose.rendered.json)
          migration_container="community-selection-l52-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}-migrate"
          docker rm -f "${migration_container}" >/dev/null 2>&1 || true
          set +e
          timeout 240s "${compose[@]}" up -d --wait postgres
          database_status=$?
          if (( database_status == 0 )); then
            timeout 180s "${compose[@]}" run --name "${migration_container}" migrate
            migration_status=$?
          else
            migration_status=0
          fi
          set -e
          if (( database_status != 0 || migration_status != 0 )); then
            "${compose[@]}" ps --all
            docker inspect "${migration_container}" || true
            docker logs "${migration_container}" || true
            "${compose[@]}" logs --no-color --tail 200 postgres
            docker rm -f "${migration_container}" || true
            exit $(( database_status != 0 ? database_status : migration_status ))
          fi
          docker rm -f "${migration_container}"

      - name: Reset production fixture
        run: |
          docker compose \
            --project-name community-selection-l52-${GITHUB_RUN_ID} \
            -f .github/l52-compose.rendered.json \
            down --volumes --remove-orphans
          docker volume rm \
            community-selection-l52-${GITHUB_RUN_ID}-secrets

      - name: Select isolated verification PostgreSQL port
        shell: bash
        run: |
          port=$((47000 + GITHUB_RUN_NUMBER % 2000))
          echo "POSTGRES_HOST_PORT=${port}" >> "${GITHUB_ENV}"
          echo "DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:${port}/community_selection?schema=public" >> "${GITHUB_ENV}"

      - name: Start verification PostgreSQL
        run: |
          docker compose \
            --project-name community-selection-l52-verify-${GITHUB_RUN_ID} \
            -f docker-compose.yml \
            up -d --wait postgres
          pnpm db:generate
          pnpm exec prisma migrate deploy --schema prisma/schema.prisma

      - name: Verify repository and historical gates
        env:
          PORT: "13080"
          ADMIN_TOKEN: l52-ci-admin-token
          ADMIN_AUTH_ENABLED: "false"
          ADMIN_AUTH_MODE: token
          WECHAT_PAY_MODE: mock
          MOCK_WECHAT_PAY: "true"
          CURRENT_USER_MOCK_HEADERS_ENABLED: "true"
          USER_SESSION_TOKEN_SECRET: l52-runner-session-secret-at-least-32-bytes
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm verify:all

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          if [[ -f .github/l52-compose.rendered.json ]]; then
            docker compose \
              --project-name community-selection-l52-${GITHUB_RUN_ID} \
              -f .github/l52-compose.rendered.json \
              down --volumes --remove-orphans || true
          fi
          docker rm -f \
            community-selection-l52-${GITHUB_RUN_ID}-secret-seed \
            community-selection-l52-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}-migrate || true
          docker volume rm \
            community-selection-l52-${GITHUB_RUN_ID}-secrets || true
          docker compose \
            --project-name community-selection-l52-verify-${GITHUB_RUN_ID} \
            -f docker-compose.yml \
            down --volumes --remove-orphans || true
          rm -f \
            .env.production.ci \
            .github/l52-compose.production.json \
            .github/l52-compose.rendered.json
          rm -rf secrets


  one-shot-l50-stable-tag-artifact:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/l53-first-launch-closure'
    permissions:
      contents: write
    runs-on: [self-hosted, community]
    timeout-minutes: 20
    steps:
      - name: Check out immutable L50 baseline
        uses: actions/checkout@v4
        with:
          ref: 47093159a5f55801a2c27316c6ca5e25749dcbae
          fetch-depth: 0
          persist-credentials: true

      - name: Create or verify stable tag
        shell: bash
        run: |
          set -euo pipefail
          target='47093159a5f55801a2c27316c6ca5e25749dcbae'
          tag='l50-a3-4-stable'
          test "$(git rev-parse HEAD^{commit})" = "$target"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-list -n 1 "$tag")" = "$target"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$tag" "$target" -m 'L50 A3-4 stable production-readiness baseline'
            git push origin "refs/tags/$tag"
          fi
          test "$(git rev-list -n 1 "$tag")" = "$target"

      - name: Build immutable private source archive
        shell: bash
        run: |
          set -euo pipefail
          target='47093159a5f55801a2c27316c6ca5e25749dcbae'
          mkdir -p one-shot-artifact
          git archive \
            --format=tar.gz \
            --prefix=community-selection-miniapp-l50-a3-4-stable/ \
            --output=one-shot-artifact/community-selection-miniapp-l50-a3-4-stable.tar.gz \
            "$target"
          (
            cd one-shot-artifact
            sha256sum community-selection-miniapp-l50-a3-4-stable.tar.gz > SHA256SUMS
          )

      - name: Upload private source artifact for one day
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: community-selection-miniapp-l50-a3-4-stable-source
          path: one-shot-artifact/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
