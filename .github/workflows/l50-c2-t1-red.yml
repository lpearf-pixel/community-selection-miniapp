name: L50 C2 T1 Gate
on:
  pull_request:
    branches: [stable/l50-a3-4-business-base]
permissions:
  contents: read
concurrency:
  group: l50-c2-t1-red-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  order-c2-t1-red:
    runs-on: self-hosted
    timeout-minutes: 40
    env:
      CI: "true"
      NODE_OPTIONS: "--max-old-space-size=3072"
      VITEST_POOL: threads
      VITEST_MIN_THREADS: "1"
      VITEST_MAX_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 20.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Verify focused C2 contracts GREEN
        shell: bash
        run: |
          pnpm db:generate
          pnpm --filter @community-selection/api test -- \
            src/modules/order/admin-order-status-command.test.ts
          pnpm --filter @community-selection/admin test -- \
            src/features/sales/orders/api.test.ts
          node --test \
            scripts/admin-e2e/l50-c2-order-source-contract.test.cjs
      - name: Verify PostgreSQL behavior and repository gates
        env:
          DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:15432/community_selection?schema=public
        shell: bash
        run: |
          docker compose \
            -p community-selection-c2-red-${GITHUB_RUN_ID} \
            -f docker-compose.yml up -d --wait postgres
          pnpm exec prisma migrate deploy --schema prisma/schema.prisma
          pnpm --filter @community-selection/shared build
          pnpm --filter @community-selection/config build
          pnpm --filter @community-selection/api test -- \
            src/modules/order/admin-order-status-executor.integration.test.ts
          pnpm --filter @community-selection/api test -- \
            src/routes/admin/order-status-route.integration.test.ts
          pnpm lint
          pnpm --workspace-concurrency=1 -r typecheck
          node --test scripts/admin-e2e/contract.test.cjs
          node --test scripts/admin-e2e/run-cleanup.test.cjs
          pnpm --workspace-concurrency=1 -r test
          pnpm build
          docker compose \
            -p community-selection-c2-red-${GITHUB_RUN_ID} \
            -f docker-compose.yml down --volumes --remove-orphans
      - name: Verify real Admin browser flow
        run: |
          pnpm setup:admin:e2e
          pnpm e2e:admin
      - name: Cleanup C2 T1 resources
        if: always()
        run: |
          node scripts/admin-e2e/cleanup-resources.cjs \
            ${GITHUB_RUN_ID} || true
          docker compose \
            -p community-selection-c2-red-${GITHUB_RUN_ID} \
            -f docker-compose.yml down --volumes --remove-orphans || true
