name: L50 C2 T1 Gate
on:
  pull_request:
    branches: [stable/l50-a3-4-business-base]
permissions:
  contents: read
concurrency:
  group: l50-c2-t1-red-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  order-c2-t1-red:
    runs-on: self-hosted
    timeout-minutes: 25
    env:
      CI: "true"
      NODE_OPTIONS: "--max-old-space-size=3072"
      VITEST_POOL: threads
      VITEST_MIN_THREADS: "1"
      VITEST_MAX_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 20.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Verify parser GREEN and remaining C2 contracts RED
        shell: bash
        run: |
          pnpm db:generate
          pnpm --filter @community-selection/api test -- \
            src/modules/order/admin-order-status-command.test.ts
          set +e
          pnpm --filter @community-selection/admin test -- \
            src/features/sales/orders/api.test.ts > admin-red.log 2>&1
          admin_status=$?
          node --test \
            scripts/admin-e2e/l50-c2-order-source-contract.test.cjs \
            > source-red.log 2>&1
          source_status=$?
          set -e
          cat admin-red.log
          cat source-red.log
          test "$admin_status" -ne 0
          test "$source_status" -ne 0
          grep -F "uses the versioned Admin order status command" admin-red.log
          grep -F "retires unauthenticated order read and write handlers" source-red.log
      - name: Prove the PostgreSQL transaction executor RED
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:15432/community_selection?schema=public
        shell: bash
        run: |
          docker compose \
            -p community-selection-c2-red-${GITHUB_RUN_ID} \
            -f docker-compose.yml up -d --wait postgres
          pnpm exec prisma migrate deploy --schema prisma/schema.prisma
          set +e
          pnpm --filter @community-selection/api test -- \
            src/modules/order/admin-order-status-executor.integration.test.ts \
            > executor-red.log 2>&1
          executor_status=$?
          set -e
          cat executor-red.log
          test "$executor_status" -ne 0
          grep -F "admin-order-status-executor" executor-red.log
      - name: Cleanup RED PostgreSQL
        if: always()
        run: |
          docker compose \
            -p community-selection-c2-red-${GITHUB_RUN_ID} \
            -f docker-compose.yml down --volumes --remove-orphans || true
