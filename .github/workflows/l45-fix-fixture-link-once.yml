name: L45 fix fixture link once

on:
  push:
    branches:
      - codex/fix-tax-status-enforcement-and-idempotency-r0mcxr
    paths:
      - scripts/l45-fix-fixture-link-once.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-tax-status-enforcement-and-idempotency-r0mcxr
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fixture repair
        run: python scripts/l45-fix-fixture-link-once.py
      - name: Remove one-time files
        run: |
          rm -f scripts/l45-fix-fixture-link-once.py
          rm -f .github/workflows/l45-fix-fixture-link-once.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(L45): keep withdrawal fixture links coherent"
          git push origin HEAD:codex/fix-tax-status-enforcement-and-idempotency-r0mcxr
