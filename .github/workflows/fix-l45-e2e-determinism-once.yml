name: Fix L45 E2E determinism once

on:
  push:
    branches:
      - codex/add-manual-tax-review-and-export-system-qgtszl

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/.fix-l45-e2e-determinism.py
      - run: rm -f scripts/.fix-l45-e2e-determinism.py .github/workflows/fix-l45-e2e-determinism-once.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-docker-api-e2e-local.ts scripts/.fix-l45-e2e-determinism.py .github/workflows/fix-l45-e2e-determinism-once.yml
          git commit -m "fix(L45): make scope and keyword E2E deterministic"
          git push
