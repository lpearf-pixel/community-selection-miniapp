name: L50 A3.1 Gate

on:
  pull_request:
    branches:
      - stable/l50-a2-business-base

concurrency:
  group: l50-a3-1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  admin-a3-1:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Verify L50 A3.1 contracts
        run: |
          pnpm --filter @community-selection/admin test -- \
            src/features/catalog/products/api.test.ts \
            src/features/catalog/products/page-model.test.ts \
            src/app/refresh-policy.test.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node --import tsx --test scripts/admin-e2e/admin-auth-runtime.test.ts
      - run: node --test scripts/admin-e2e/contract.test.cjs scripts/admin-e2e/run-cleanup.test.cjs
      - run: pnpm setup:admin:e2e
      - run: pnpm e2e:admin
      - name: Cleanup current E2E resources
        if: always()
        run: node scripts/admin-e2e/cleanup-resources.cjs "$GITHUB_RUN_ID"
