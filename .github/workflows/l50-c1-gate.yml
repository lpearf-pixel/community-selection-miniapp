name: L50 C1 Gate

on:
  pull_request:
    branches:
      - stable/l50-a3-4-business-base

concurrency:
  group: l50-c1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  admin-c1:
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=3072
      VITEST_MIN_THREADS: 1
      VITEST_MAX_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Verify L50 C1 contracts
        run: |
          pnpm exec vitest run packages/shared/test/api-contract.test.ts apps/api/src/routes/admin/order-list-query.test.ts
          pnpm --filter @community-selection/admin test -- \
            src/features/sales/orders/api.test.ts \
            src/features/sales/orders/page-model.test.ts
          node --test scripts/admin-e2e/contract.test.cjs
      - run: pnpm lint
      - name: Typecheck with bounded workspace concurrency
        run: |
          pnpm --filter @community-selection/shared build
          grep -nE "PaginatedData|contractOk" packages/shared/src/index.ts packages/shared/dist/index.d.ts
          readlink -f apps/admin/node_modules/@community-selection/shared
          pnpm --filter @community-selection/config build
          node --input-type=module <<'NODE'
          import ts from 'typescript';
          const configFile = ts.readConfigFile('apps/admin/tsconfig.json', ts.sys.readFile);
          const parsed = ts.parseJsonConfigFileContent(configFile.config, ts.sys, 'apps/admin');
          const program = ts.createProgram(parsed.fileNames, parsed.options);
          const checker = program.getTypeChecker();
          const shared = program.getSourceFiles().find((file) => file.fileName.endsWith('/packages/shared/dist/index.d.ts'));
          const typesFile = program.getSourceFiles().find((file) => file.fileName.endsWith('/features/sales/orders/types.ts'));
          const moduleSymbol = shared && checker.getSymbolAtLocation(shared);
          console.log('shared-source', shared?.fileName);
          console.log('shared-exports', moduleSymbol ? checker.getExportsOfModule(moduleSymbol).map((symbol) => symbol.name).sort() : []);
          let imported;
          const visit = (node) => {
            if (ts.isImportSpecifier(node) && node.name.text === 'PaginatedData') imported = node.name;
            ts.forEachChild(node, visit);
          };
          if (typesFile) visit(typesFile);
          const importSymbol = imported && checker.getSymbolAtLocation(imported);
          console.log('import-symbol', importSymbol?.name, importSymbol?.flags);
          console.log('alias-target', importSymbol && (importSymbol.flags & ts.SymbolFlags.Alias) ? checker.getAliasedSymbol(importSymbol).name : null);
          console.log('diagnostics', ts.getPreEmitDiagnostics(program).filter((diagnostic) => diagnostic.file?.fileName.endsWith('/features/sales/orders/types.ts')).map((diagnostic) => ts.flattenDiagnosticMessageText(diagnostic.messageText, '\n')));
          NODE
          pnpm --workspace-concurrency=1 -r typecheck
      - name: Test with bounded workspace concurrency
        run: |
          node --test scripts/admin-e2e/contract.test.cjs
          pnpm --workspace-concurrency=1 -r test
      - run: pnpm build
      - run: node --import tsx --test scripts/admin-e2e/admin-auth-runtime.test.ts
      - run: node --test scripts/admin-e2e/contract.test.cjs scripts/admin-e2e/run-cleanup.test.cjs
      - run: pnpm setup:admin:e2e
      - run: pnpm e2e:admin
      - name: Cleanup current E2E resources
        if: always()
        run: node scripts/admin-e2e/cleanup-resources.cjs "$GITHUB_RUN_ID"
