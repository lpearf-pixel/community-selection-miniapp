name: L50 C2 T3C Inventory Adjust Gate

on:
  pull_request:
    branches:
      - stable/l50-a3-4-business-base
    paths:
      - .github/workflows/l50-c2-t3c-inventory-adjust-gate.yml
      - apps/api/src/modules/inventory/**
      - apps/api/src/routes/inventory.ts
      - apps/api/src/routes/admin-inventory-adjust-route.test.ts
      - apps/api/src/routes/admin-inventory-adjust-route.integration.test.ts
      - apps/admin/src/features/inventory/overview/**
      - scripts/inventory-e2e/**
      - scripts/verify-l50-c2-t3c-inventory-adjust-command-local.ts
      - docker-compose.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l50-c2-t3c-inventory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      VITEST_MAX_THREADS: "2"
      VITEST_MIN_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
      - name: Select isolated PostgreSQL port
        run: |
          port=$((30000 + GITHUB_RUN_NUMBER % 10000))
          echo "POSTGRES_HOST_PORT=${port}" >> "${GITHUB_ENV}"
          echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:${port}/community_selection?schema=public" >> "${GITHUB_ENV}"
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Build API workspace dependencies
        run: |
          pnpm --filter @community-selection/shared build
          pnpm --filter @community-selection/config build
      - name: Verify focused source, unit, Admin, and types
        run: pnpm exec tsx scripts/verify-l50-c2-t3c-inventory-adjust-command-local.ts
      - name: Start isolated PostgreSQL
        run: |
          docker compose \
            -p community-selection-c2t3c-${GITHUB_RUN_ID} \
            -f docker-compose.yml up -d --wait postgres
      - name: Prepare PostgreSQL
        run: |
          pnpm db:generate
          pnpm exec prisma migrate deploy --schema prisma/schema.prisma
      - name: Verify PostgreSQL concurrency and rollback
        run: |
          pnpm exec tsx \
            scripts/verify-l50-c2-t3c-inventory-adjust-command-local.ts \
            --with-postgres
      - name: Reset focused PostgreSQL
        run: |
          docker compose \
            -p community-selection-c2t3c-${GITHUB_RUN_ID} \
            -f docker-compose.yml down --volumes --remove-orphans
      - name: Verify real Admin browser
        run: |
          pnpm setup:admin:e2e
          pnpm e2e:admin
      - name: Start baseline audit PostgreSQL
        run: |
          docker compose \
            -p community-selection-c2t3c-audit-${GITHUB_RUN_ID} \
            -f docker-compose.yml up -d --wait postgres
      - name: Collect baseline audit
        run: |
          pnpm exec tsx scripts/verify-baseline-audit-local.ts \
            --report-only \
            --output-dir=artifacts/verification-baseline
      - name: Reset PostgreSQL for full release gate
        run: |
          docker compose \
            -p community-selection-c2t3c-audit-${GITHUB_RUN_ID} \
            -f docker-compose.yml down --volumes --remove-orphans
          docker compose \
            -p community-selection-c2t3c-audit-${GITHUB_RUN_ID} \
            -f docker-compose.yml up -d --wait postgres
      - name: Verify all
        run: pnpm verify:all
      - name: Publish audit summary
        if: always()
        run: |
          if [[ -f artifacts/verification-baseline/summary.md ]]; then
            cat artifacts/verification-baseline/summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l50-c2-t3c-baseline-${{ github.sha }}
          path: artifacts/verification-baseline
          retention-days: 14
          if-no-files-found: error
      - name: Package source snapshot for continuation
        if: always()
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude='**/node_modules' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='reports' \
            -czf /tmp/l50-c2-t3c-source.tgz .
      - name: Upload source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l50-c2-t3c-source-${{ github.sha }}
          path: /tmp/l50-c2-t3c-source.tgz
          retention-days: 1
          if-no-files-found: error
      - name: Cleanup PostgreSQL
        if: always()
        run: |
          docker compose \
            -p community-selection-c2t3c-${GITHUB_RUN_ID} \
            -f docker-compose.yml down --volumes --remove-orphans || true
          docker compose \
            -p community-selection-c2t3c-audit-${GITHUB_RUN_ID} \
            -f docker-compose.yml down --volumes --remove-orphans || true
          node scripts/admin-e2e/cleanup-resources.cjs "${GITHUB_RUN_ID}" || true
