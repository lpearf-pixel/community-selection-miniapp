name: L50 Admin E2E

on:
  pull_request:
    branches:
      - stable/l49-business-base
  workflow_dispatch:

concurrency:
  group: l50-admin-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  admin-e2e:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm db:generate
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Verify Admin auth runtime
        run: node --import tsx --test scripts/admin-e2e/admin-auth-runtime.test.ts
      - name: Verify Admin E2E contracts
        run: node --test scripts/admin-e2e/contract.test.cjs scripts/admin-e2e/run-cleanup.test.cjs
      - name: Install Admin E2E dependencies
        run: pnpm setup:admin:e2e
      - name: Install Chromium
        run: pnpm --dir scripts/admin-e2e exec playwright install chromium
      - name: Run Admin browser smoke
        run: pnpm e2e:admin
