name: L51 workspace recovery

on:
  push:
    branches:
      - codex/l51-real-wechat-commerce-loop
    paths:
      - .github/workflows/l51-workspace-recovery.yml
      - .github/l51-workspace-recovery.trigger
  pull_request:
    branches:
      - stable/l50-a3-4-business-base
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-private-source:
    name: Package private source snapshot
    runs-on: [self-hosted, community]
    timeout-minutes: 15
    steps:
      - name: Check out L51 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Create credential-free source archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=/tmp/community-selection-l51-source.tar.gz HEAD
          tar -tzf /tmp/community-selection-l51-source.tar.gz >/dev/null

      - name: Upload private source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: community-selection-l51-source
          path: /tmp/community-selection-l51-source.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
