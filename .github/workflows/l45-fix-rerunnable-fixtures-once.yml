name: L45 rerunnable fixture fix once

on:
  push:
    branches:
      - codex/add-manual-tax-review-and-export-system-qgtszl

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/add-manual-tax-review-and-export-system-qgtszl
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic patch
        run: python scripts/l45-fix-rerunnable-fixtures-once.py
      - name: Remove one-time files
        run: |
          rm scripts/l45-fix-rerunnable-fixtures-once.py
          rm .github/workflows/l45-fix-rerunnable-fixtures-once.yml
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/verify-docker-api-e2e-local.ts scripts/verify-l45-manual-tax-review-export-local.ts docs/dev/stage-verifier-compatibility.md docs/plans/next-stage-development-plan.md scripts/l45-fix-rerunnable-fixtures-once.py .github/workflows/l45-fix-rerunnable-fixtures-once.yml
          git commit -m "fix(L45): make Docker E2E fixtures rerunnable"
          git push origin HEAD:codex/add-manual-tax-review-and-export-system-qgtszl
