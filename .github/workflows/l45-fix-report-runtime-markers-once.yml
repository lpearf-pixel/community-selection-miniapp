name: L45 fix report runtime markers once
on:
  push:
    branches:
      - codex/fix-tax-status-enforcement-and-idempotency
    paths:
      - scripts/l45-fix-report-runtime-markers-once.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-tax-status-enforcement-and-idempotency
          fetch-depth: 0
      - run: python3 scripts/l45-fix-report-runtime-markers-once.py
      - run: rm -f scripts/l45-fix-report-runtime-markers-once.py .github/workflows/l45-fix-report-runtime-markers-once.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-docker-api-e2e-local.ts scripts/verify-l45-manual-tax-review-export-local.ts scripts/generate-stage-report.ts scripts/verify-report-publish-local.ts docs/dev/stage-verifier-compatibility.md docs/plans/next-stage-development-plan.md scripts/l45-fix-report-runtime-markers-once.py .github/workflows/l45-fix-report-runtime-markers-once.yml
          git commit -m "fix(L45): align report evidence with same-key idempotency"
          git push origin HEAD:codex/fix-tax-status-enforcement-and-idempotency
