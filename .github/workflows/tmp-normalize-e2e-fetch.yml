name: Normalize Docker E2E fetch usage

on:
  push:
    branches:
      - codex/add-manual-tax-review-and-export-system-qgtszl

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/add-manual-tax-review-and-export-system-qgtszl
          fetch-depth: 0
      - name: Apply focused patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          e2e_path = Path('scripts/verify-docker-api-e2e-local.ts')
          e2e = e2e_path.read_text()
          old = "const csvResponse = await fetch(`${API_BASE_URL}/api/admin/tax-records/export.csv`, { headers: financeAHeaders });"
          new = "const csvResponse = await fetchOrThrow('GET', '/api/admin/tax-records/export.csv', { headers: financeAHeaders });"
          if old not in e2e:
              raise SystemExit('direct CSV fetch block not found')
          e2e = e2e.replace(old, new, 1)
          e2e_path.write_text(e2e)

          verifier_path = Path('scripts/verify-l45-manual-tax-review-export-local.ts')
          verifier = verifier_path.read_text()
          needle = "for (const readinessMarker of ['waitForApiReady', \"'/api/health'\", 'fetchWithTimeout', 'fetchOrThrow', 'Docker API E2E target:', 'docker compose logs --tail=200 api']) {\n  assert(e2e.includes(readinessMarker), `Docker E2E readiness/diagnostics must include ${readinessMarker}`);\n}"
          replacement = needle + "\nassert(!e2e.includes('await fetch(`${API_BASE_URL}'), 'Docker E2E API calls must go through fetchOrThrow for diagnostics');"
          if needle not in verifier:
              raise SystemExit('readiness verifier block not found')
          verifier = verifier.replace(needle, replacement, 1)
          verifier_path.write_text(verifier)
          PY
      - name: Remove temporary workflow and trigger
        run: |
          rm -f .github/workflows/tmp-normalize-e2e-fetch.yml
          rm -f .github/.tmp-normalize-e2e-fetch-trigger
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-docker-api-e2e-local.ts scripts/verify-l45-manual-tax-review-export-local.ts .github/workflows/tmp-normalize-e2e-fetch.yml .github/.tmp-normalize-e2e-fetch-trigger
          git commit -m "fix(L45): route all E2E calls through diagnostics"
          git push origin HEAD:codex/add-manual-tax-review-and-export-system-qgtszl
