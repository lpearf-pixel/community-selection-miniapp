name: L45 fix JSON idempotency

on:
  push:
    branches:
      - codex/add-manual-tax-review-and-export-system-qgtszl

permissions:
  contents: write

concurrency:
  group: l45-fix-json-idempotency
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/add-manual-tax-review-and-export-system-qgtszl
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/l45-fix-json-idempotency-once.py
      - name: Remove one-time files
        run: |
          rm -f scripts/l45-fix-json-idempotency-once.py
          rm -f .github/workflows/l45-fix-json-idempotency.yml
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/src/routes/withdrawals.ts \
                  scripts/verify-docker-api-e2e-local.ts \
                  scripts/verify-l45-manual-tax-review-export-local.ts \
                  docs/dev/stage-verifier-compatibility.md \
                  docs/plans/next-stage-development-plan.md \
                  scripts/l45-fix-json-idempotency-once.py \
                  .github/workflows/l45-fix-json-idempotency.yml
          git commit -m "fix(L45): compare tax review payloads semantically"
          git push origin HEAD:codex/add-manual-tax-review-and-export-system-qgtszl
