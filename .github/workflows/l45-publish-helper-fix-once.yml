name: L45 publish helper fix once

on:
  push:
    branches:
      - codex/fix-tax-status-enforcement-and-idempotency-bgzifu
    paths:
      - scripts/l45-publish-helper-fix-trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-tax-status-enforcement-and-idempotency-bgzifu
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply publish verifier patch
        run: python scripts/l45-publish-helper-fix-once.py
      - name: Remove one-shot files
        run: |
          rm -f scripts/l45-publish-helper-fix-once.py
          rm -f scripts/l45-publish-helper-fix-trigger.txt
          rm -f .github/workflows/l45-publish-helper-fix-once.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(L45): verify shared concurrent marker semantics in report publish"
          git push origin HEAD:codex/fix-tax-status-enforcement-and-idempotency-bgzifu
