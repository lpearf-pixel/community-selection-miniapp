name: L45 CSV BOM byte fix once
on:
  push:
    branches:
      - codex/add-manual-tax-review-and-export-system-qgtszl
    paths:
      - scripts/l45-fix-csv-bom-bytes-once.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/add-manual-tax-review-and-export-system-qgtszl
          fetch-depth: 0
      - run: python3 scripts/l45-fix-csv-bom-bytes-once.py
      - run: rm -f scripts/l45-fix-csv-bom-bytes-once.py .github/workflows/l45-fix-csv-bom-bytes-once.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/verify-docker-api-e2e-local.ts scripts/verify-l45-manual-tax-review-export-local.ts docs/dev/stage-verifier-compatibility.md docs/plans/next-stage-development-plan.md scripts/l45-fix-csv-bom-bytes-once.py .github/workflows/l45-fix-csv-bom-bytes-once.yml
          git commit -m "fix(L45): verify CSV BOM from raw response bytes"
          git push origin HEAD:codex/add-manual-tax-review-and-export-system-qgtszl
