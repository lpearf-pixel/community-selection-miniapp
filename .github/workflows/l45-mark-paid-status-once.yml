name: L45 mark-paid status one-shot

on:
  push:
    branches:
      - codex/fix-tax-status-enforcement-and-idempotency-bgzifu
    paths:
      - scripts/l45-fix-mark-paid-status-once.py
      - .github/workflows/l45-mark-paid-status-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-tax-status-enforcement-and-idempotency-bgzifu
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply status propagation repair
        run: python scripts/l45-fix-mark-paid-status-once.py
      - name: Commit formal changes and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix(L45): preserve mark-paid conflict HTTP status"
            git push origin HEAD:codex/fix-tax-status-enforcement-and-idempotency-bgzifu
          fi
