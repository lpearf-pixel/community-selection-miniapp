name: L45 fix L44 tax review contract once

on:
  push:
    branches:
      - codex/fix-tax-status-enforcement-and-idempotency
    paths:
      - scripts/l45-fix-l44-tax-review-contract-once.py

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-tax-status-enforcement-and-idempotency
          fetch-depth: 0
      - name: Apply compatibility fix
        run: python3 scripts/l45-fix-l44-tax-review-contract-once.py
      - name: Remove one-time files
        run: |
          rm -f scripts/l45-fix-l44-tax-review-contract-once.py
          rm -f .github/workflows/l45-fix-l44-tax-review-contract-once.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-docker-api-e2e-local.ts \
                  scripts/verify-l44-manual-withdrawal-review-local.ts \
                  scripts/verify-l45-manual-tax-review-export-local.ts \
                  docs/dev/stage-verifier-compatibility.md \
                  docs/plans/next-stage-development-plan.md \
                  scripts/l45-fix-l44-tax-review-contract-once.py \
                  .github/workflows/l45-fix-l44-tax-review-contract-once.yml
          git diff --cached --quiet || git commit -m "fix(L45): align L44 tax review E2E with mutation contract"
          git push origin HEAD:codex/fix-tax-status-enforcement-and-idempotency
