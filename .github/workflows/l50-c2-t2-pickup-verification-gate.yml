name: L50 C2 T2 Gate

on:
  pull_request:
    branches:
      - stable/l50-a3-4-business-base
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l50-c2-t2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pickup-c2-t2:
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      VITEST_MAX_THREADS: "2"
      VITEST_MIN_THREADS: "1"
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:15432/community_selection?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Verify focused pickup contracts
        run: |
          pnpm db:generate
          pnpm --filter @community-selection/api test -- \
            src/modules/order/admin-pickup-verification-command.test.ts \
            src/modules/order/admin-order-status-command.test.ts
          pnpm --filter @community-selection/admin test -- \
            src/features/sales/orders/api.test.ts
          node --test \
            scripts/admin-e2e/l50-c2-order-source-contract.test.cjs \
            scripts/admin-e2e/contract.test.cjs

      - name: Verify pickup writes on PostgreSQL
        shell: bash
        run: |
          docker compose \
            -p community-selection-c2-t2-${GITHUB_RUN_ID} \
            -f docker-compose.yml up -d --wait postgres
          pnpm exec prisma migrate deploy --schema prisma/schema.prisma
          pnpm --filter @community-selection/shared build
          pnpm --filter @community-selection/config build
          pnpm --filter @community-selection/api test -- \
            src/modules/order/admin-pickup-verification-executor.integration.test.ts
          pnpm --filter @community-selection/api test -- \
            src/routes/admin/order-pickup-verification-route.integration.test.ts
          pnpm --filter @community-selection/api test -- \
            src/routes/admin/order-auxiliary-security.integration.test.ts

      - name: Verify complete repository
        run: pnpm verify:all

      - name: Stop focused PostgreSQL
        if: always()
        shell: bash
        run: |
          docker compose \
            -p community-selection-c2-t2-${GITHUB_RUN_ID} \
            -f docker-compose.yml down --volumes --remove-orphans || true

      - name: Set up Admin browser
        run: pnpm setup:admin:e2e

      - name: Verify real Admin browser
        run: pnpm e2e:admin

      - name: Cleanup C2 T2 resources
        if: always()
        shell: bash
        run: |
          docker rm -f community-selection-admin-e2e-browser-${GITHUB_RUN_ID} || true
          docker compose \
            -p community-selection-admin-e2e-${GITHUB_RUN_ID} \
            -f docker-compose.yml down --volumes --remove-orphans || true
          docker compose \
            -p community-selection-c2-t2-${GITHUB_RUN_ID} \
            -f docker-compose.yml down --volumes --remove-orphans || true
