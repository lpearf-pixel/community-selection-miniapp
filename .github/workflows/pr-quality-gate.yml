name: Self-hosted runner connectivity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-connectivity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connectivity:
    runs-on: [self-hosted, Linux, X64, lan, docker, home, chan-shuo]
    timeout-minutes: 5
    steps:
      - name: Report runner context
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "repository=${GITHUB_REPOSITORY}"
          echo "event=${GITHUB_EVENT_NAME}"
          test "${GITHUB_REPOSITORY}" = "lpearf-pixel/community-selection-miniapp"
