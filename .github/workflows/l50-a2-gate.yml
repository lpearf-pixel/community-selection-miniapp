name: L50 A2 Gate

on:
  push:
    branches:
      - codex/l50-a2-readonly-feature-slices
  pull_request:
    branches:
      - stable/l50-business-base

concurrency:
  group: l50-a2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  admin-a2:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Verify L50 A2 contracts
        run: |
          pnpm --filter @community-selection/admin test --             src/shared/state/feature-resource.test.ts             src/features/finance/reconciliation/api.test.ts             src/features/operations/dashboard/api.test.ts             src/app/refresh-policy.test.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node --import tsx --test scripts/admin-e2e/admin-auth-runtime.test.ts
      - run: node --test scripts/admin-e2e/contract.test.cjs scripts/admin-e2e/run-cleanup.test.cjs
      - run: pnpm e2e:admin
