name: L45 API contract patch trigger

on:
  push:
    branches:
      - codex/fix-tax-status-enforcement-and-idempotency-r0mcxr
    paths:
      - scripts/l45-api-contract-trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-tax-status-enforcement-and-idempotency-r0mcxr
          fetch-depth: 0
      - name: Apply API contract-driven test fix
        run: python3 scripts/l45-api-contract-fix-once.py
      - name: Remove one-time files
        run: |
          rm -f scripts/l45-api-contract-fix-once.py
          rm -f scripts/l45-api-contract-trigger.txt
          rm -f .github/workflows/l45-api-contract-fix-once.yml
          rm -f .github/workflows/l45-api-contract-trigger.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(L45): align E2E with documented API contract"
          git push origin HEAD:codex/fix-tax-status-enforcement-and-idempotency-r0mcxr
