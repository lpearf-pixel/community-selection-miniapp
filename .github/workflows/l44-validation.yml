name: Validate finalized L44 tree

on:
  push:
    branches:
      - validation/l44-e1ab5489
    paths-ignore:
      - validation-results/**

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation tree
        uses: actions/checkout@v4
        with:
          ref: validation/l44-e1ab5489
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Run validations and capture logs
        id: validations
        shell: bash
        run: |
          set +e
          mkdir -p validation-results
          LOG=validation-results/l44-e1ab5489.log
          : > "$LOG"

          run_check() {
            local name="$1"
            shift
            echo "=== $name ===" | tee -a "$LOG"
            "$@" >>"$LOG" 2>&1
            local code=$?
            echo "$name=$code" | tee -a "$LOG"
            printf '%s=%s\n' "$name" "$code" >> validation-results/l44-e1ab5489.status
          }

          : > validation-results/l44-e1ab5489.status
          echo 'source_commit=e1ab5489f9efe4a3f8b95be6824bcbba8dc8ebca' >> validation-results/l44-e1ab5489.status
          run_check install pnpm install --frozen-lockfile
          run_check prisma_generate pnpm db:generate
          run_check prisma_validate pnpm exec prisma validate --schema prisma/schema.prisma
          run_check api_typecheck pnpm --filter @community-selection/api exec tsc -p tsconfig.json --noEmit --pretty false
          run_check admin_typecheck pnpm --filter @community-selection/admin exec tsc -p tsconfig.json --noEmit --pretty false
          run_check l44_verifier pnpm exec tsx scripts/verify-l44-manual-withdrawal-review-local.ts
          run_check compliance pnpm exec tsx scripts/verify-no-raw-compliance-terms-local.ts
          run_check diff_check git diff --check e1ab5489f9efe4a3f8b95be6824bcbba8dc8ebca^ e1ab5489f9efe4a3f8b95be6824bcbba8dc8ebca

          if grep -Eq '=(1|2|3|4|5|6|7|8|9|[1-9][0-9]+)$' validation-results/l44-e1ab5489.status; then
            echo 'overall=failure' >> validation-results/l44-e1ab5489.status
          else
            echo 'overall=success' >> validation-results/l44-e1ab5489.status
          fi

      - name: Persist validation outcomes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation-results/l44-e1ab5489.status validation-results/l44-e1ab5489.log
          git commit -m "chore: record detailed L44 validation outcomes" || true
          git push origin HEAD:validation/l44-e1ab5489

      - name: Fail when validation failed
        if: always()
        run: |
          grep -q '^overall=success$' validation-results/l44-e1ab5489.status
