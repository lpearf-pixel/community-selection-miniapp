name: Apply Docker API readiness patch

on:
  push:
    branches:
      - codex/add-manual-tax-review-and-export-system-qgtszl

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/add-manual-tax-review-and-export-system-qgtszl
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/.tmp-patch-api-readiness.py
      - name: Remove temporary patch files
        run: |
          rm -f scripts/.tmp-patch-api-readiness.py
          rm -f .github/workflows/tmp-apply-api-readiness.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-docker-api-e2e-local.ts scripts/verify-l45-manual-tax-review-export-local.ts docs/dev/stage-verifier-compatibility.md docs/plans/next-stage-development-plan.md scripts/.tmp-patch-api-readiness.py .github/workflows/tmp-apply-api-readiness.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(L45): wait for Docker API readiness"
          git push origin HEAD:codex/add-manual-tax-review-and-export-system-qgtszl
