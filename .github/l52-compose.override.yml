services:
  migrate:
    volumes:
      - type: volume
        source: l52-secrets
        target: /run/secrets/wechat_private_key.pem
        read_only: true
        volume:
          subpath: wechat_private_key.pem
      - type: volume
        source: l52-secrets
        target: /run/secrets/wechat_platform_certificate.pem
        read_only: true
        volume:
          subpath: wechat_platform_certificate.pem

  api:
    volumes:
      - type: volume
        source: l52-secrets
        target: /run/secrets/wechat_private_key.pem
        read_only: true
        volume:
          subpath: wechat_private_key.pem
      - type: volume
        source: l52-secrets
        target: /run/secrets/wechat_platform_certificate.pem
        read_only: true
        volume:
          subpath: wechat_platform_certificate.pem

  backup:
    volumes:
      - type: volume
        source: l52-secrets
        target: /run/secrets/backup_passphrase
        read_only: true
        volume:
          subpath: backup_passphrase

  restore:
    volumes:
      - type: volume
        source: l52-secrets
        target: /run/secrets/backup_passphrase
        read_only: true
        volume:
          subpath: backup_passphrase

volumes:
  l52-secrets:
    name: ${L52_SECRETS_VOLUME:?L52_SECRETS_VOLUME is required}
