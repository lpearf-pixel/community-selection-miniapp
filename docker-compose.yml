services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: community_selection
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d community_selection"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: node:22-bookworm-slim
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/community_selection?schema=public
      PORT: 13080
      WECHAT_PAY_MODE: mock
      MOCK_WECHAT_PAY: "true"
      ADMIN_AUTH_ENABLED: "false"
      AUTO_PAYOUT_ENABLED: "false"
      AUTO_TAX_FILING_ENABLED: "false"
    ports:
      - "13080:13080"
    volumes:
      - .:/app
      - api-node-modules:/app/node_modules
      - api-pnpm-store:/root/.local/share/pnpm/store
    command: sh -lc "apt-get update -y && apt-get install -y openssl ca-certificates && corepack enable && corepack prepare pnpm@9.15.4 --activate && pnpm config set registry https://registry.npmjs.org/ && pnpm config set verify-store-integrity false && pnpm config set store-dir /root/.local/share/pnpm/store && (pnpm store prune || true) && pnpm install --force && pnpm --filter @community-selection/shared build && pnpm --filter @community-selection/config build && pnpm exec tsx -e \"import * as m from '@community-selection/shared'; if (typeof m.fail !== 'function' || typeof m.ok !== 'function') throw new Error('shared exports missing'); console.log('shared exports ok')\" && pnpm db:generate && pnpm db:migrate && pnpm db:seed && pnpm --filter @community-selection/api dev"

  admin:
    image: node:22-bookworm-slim
    working_dir: /app
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: http://localhost:13080
    ports:
      - "13081:13081"
    volumes:
      - .:/app
      - admin-node-modules:/app/node_modules
      - admin-pnpm-store:/root/.local/share/pnpm/store
    command: sh -lc "apt-get update -y && apt-get install -y openssl ca-certificates && corepack enable && corepack prepare pnpm@9.15.4 --activate && pnpm config set registry https://registry.npmjs.org/ && pnpm config set verify-store-integrity false && pnpm config set store-dir /root/.local/share/pnpm/store && (pnpm store prune || true) && pnpm install --force && pnpm --filter @community-selection/shared build && pnpm --filter @community-selection/config build && pnpm exec tsx -e \"import * as m from '@community-selection/shared'; if (typeof m.fail !== 'function' || typeof m.ok !== 'function') throw new Error('shared exports missing'); console.log('shared exports ok')\" && pnpm --filter @community-selection/admin dev -- --host 0.0.0.0 --port 13081"

volumes:
  postgres-data:
  api-node-modules:
  api-pnpm-store:
  admin-node-modules:
  admin-pnpm-store:
